name: Gold Regression

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_live_llm:
        description: Run live LLM regression when OPENAI_API_KEY is configured
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  deterministic-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Node dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Gold fixture regression
        run: npm run eval:fixture

  live-llm-regression:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_live_llm }}
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: gpt-5.4-mini
      ANALYZER_PROMPT_VERSION: v0.2.0
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Require API key
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "OPENAI_API_KEY secret is not configured."
            exit 1
          fi

      - name: Install Node dependencies
        run: npm install

      - name: Live analyzer + Gold evaluation
        run: npm run eval:live
